name: Build

on:
  push:
    branches: [main]  # 改为监听 main 分支推送
  workflow_dispatch:  # 保留手动触发能力

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: game-info-server

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: false

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true

          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-22.04
            cross: true

          - target: x86_64-pc-windows-msvc
            os: windows-2022
            cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare artifact (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz ${{ env.BINARY_NAME }}
          cd -
          sha256sum ${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz \
            > ${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz.sha256

      - name: Prepare artifact (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ env.BINARY_NAME }}.exe `
            -DestinationPath ../../../${{ env.BINARY_NAME }}-${{ matrix.target }}.zip
          cd $env:GITHUB_WORKSPACE
          $hash = (Get-FileHash "${{ env.BINARY_NAME }}-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ env.BINARY_NAME }}-${{ matrix.target }}.zip" `
            | Out-File "${{ env.BINARY_NAME }}-${{ matrix.target }}.zip.sha256" -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: |
            ${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz
            ${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz.sha256
            ${{ env.BINARY_NAME }}-${{ matrix.target }}.zip
            ${{ env.BINARY_NAME }}-${{ matrix.target }}.zip.sha256
          if-no-files-found: ignore
          retention-days: 7
